version: '3.8'

networks:
  erp_back:
    external: true
    name: erp_back

services:
  nginx:
    image: nginx:stable-alpine
    container_name: erp_back_nginx
    hostname: erp_back_nginx
    restart: unless-stopped
    depends_on:
      - php
      - mysql
      - redis
      - queue
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/log:/var/log/nginx
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp_back

  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: php:8.3-fpm-alpine
    container_name: erp_back_php
    hostname: erp_back_php
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    volumes:
      - ./:/var/www/html
    networks:
      - erp_back

  redis:
    image: redis:7-alpine
    container_name: erp_back_redis
    hostname: erp_back_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - erp_back

  mysql:
    image: mysql:8.0
    container_name: erp_back_mysql
    hostname: erp_back_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - erp_back

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_back_queue
    hostname: queue
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/var/www/html
    networks:
      - erp_back
    command: php artisan horizon

volumes:
  mysql_data:
  redis_data:
